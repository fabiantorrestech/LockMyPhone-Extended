# Builds a debug APK on every push. The APK is uploaded as a run artifact and
# attached to the rolling "latest-debug" prerelease, so it can be grabbed from a phone.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit, so run it through bash.
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LockMyPhone-Extended-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LockMyPhone-Extended-debug
          path: LockMyPhone-Extended-debug.apk

      - name: Publish to latest-debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug LockMyPhone-Extended-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
