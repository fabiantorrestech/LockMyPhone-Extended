# Builds the release APK (R8, debug-signed) on every push. The APK is uploaded as a run artifact and
# attached to the rolling "latest-build" prerelease, so it can be grabbed from a phone.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK; install the platform this app compiles against.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -5 \
            || echo "::warning::sdkmanager could not preinstall platform 37; AGP will try"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit, so run it through bash.
      - name: Build release APK
        run: |
          set -o pipefail
          bash ./gradlew assembleRelease 2>&1 | tee build.log || {
            # Run logs aren't always reachable, so surface the error lines as annotations.
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LockMyPhone-Extended.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LockMyPhone-Extended
          path: LockMyPhone-Extended.apk

      - name: Publish to latest-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build LockMyPhone-Extended.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Release APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
