# Builds the release APK (R8, debug-signed) and the debug APK (separate .debug app) on every push. Both are
# uploaded as a run artifact and attached to the rolling "latest-build" prerelease, so they can be grabbed
# from a phone. Pushes to main also replace both on the app hub (fabiantorrestech/android-apps, release
# "lockmyphoneextended"; hub ADR 7), the same two files as the hub's scripts/publish-local.ps1.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: LockMyPhoneExtended.apk
  DEBUG_APK_NAME: LockMyPhoneExtended-debug.apk
  HUB_REPO: fabiantorrestech/android-apps
  HUB_TAG: lockmyphoneextended

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # versionCode = git rev-list --count HEAD, so the whole history is needed.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK; install the platform this app compiles against.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -5 \
            || echo "::warning::sdkmanager could not preinstall platform 37; AGP will try"

      # The release build is signed with the debug key. Use the PC's debug keystore so every build
      # (CI or PC) has the same key and installs over the copy on the phone. Without the secret the
      # runner would sign with a fresh random key, so the hub publish below refuses such a build.
      - name: Debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_B64 is not set: this APK is signed with a throwaway key."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit, so run it through bash.
      - name: Build release and debug APKs
        run: |
          set -o pipefail
          bash ./gradlew assembleRelease assembleDebug 2>&1 | tee build.log || {
            # Run logs aren't always reachable, so surface the error lines as annotations.
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: LockMyPhoneExtended
          path: |
            ${{ env.APK_NAME }}
            ${{ env.DEBUG_APK_NAME }}

      - name: Publish to latest-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build "$APK_NAME" "$DEBUG_APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Release and debug APKs built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."

      # Same checks as the hub's scripts/publish-local.ps1: the signer must be the key the hub expects
      # (apps.json -> keys.DEBUG_SHARED), then both APKs replace the ones on the app's rolling release.
      - name: Publish to the app hub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.APP_HUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret APP_HUB_TOKEN is not set, so the APK was not published to $HUB_REPO."
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          expected=$(curl -fsSL "https://raw.githubusercontent.com/$HUB_REPO/main/apps.json" | jq -r '.keys.DEBUG_SHARED')
          actual=$("$build_tools/apksigner" verify --print-certs "$APK_NAME" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::$APK_NAME is signed with $actual, expected the DEBUG_SHARED key $expected. Check secret DEBUG_KEYSTORE_B64."
            exit 1
          fi
          badging=$("$build_tools/aapt2" dump badging "$APK_NAME" | head -1)
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          title="LockMyPhone Extended $name ($code)"
          notes="Built by GitHub Actions from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} (main) on $(date -u '+%Y-%m-%d %H:%M') UTC."
          if gh release view "$HUB_TAG" --repo "$HUB_REPO" --json tagName > /dev/null 2>&1; then
            gh release upload "$HUB_TAG" "$APK_NAME" "$DEBUG_APK_NAME" --repo "$HUB_REPO" --clobber
            gh release edit "$HUB_TAG" --repo "$HUB_REPO" --title "$title" --notes "$notes"
          else
            gh release create "$HUB_TAG" "$APK_NAME" "$DEBUG_APK_NAME" --repo "$HUB_REPO" --target main --title "$title" --notes "$notes" --latest=false
          fi
          echo "Published $title to $HUB_REPO release '$HUB_TAG'."
